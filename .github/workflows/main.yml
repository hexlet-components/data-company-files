name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Набор правят руками, и пропавшая ловушка снаружи неотличима от целого набора:
      # файлы на месте, README прежний, а требование шага перестало проверяться.
      - run: make test
